# SPDX-License-Identifier: MPL-2.0
#
# Marid — portable compose stack (Tier B)
#
# This is the runtime-agnostic, OCI compose-spec file. It works unchanged with:
#   podman compose  -f build/container/compose.yaml up -d
#   nerdctl compose -f build/container/compose.yaml up -d
#   docker  compose -f build/container/compose.yaml up -d
#
# It has NO dependency on the stapeln tier. For the sovereign path
# (selur zero-copy IPC, signed .ctp bundles, svalinn trust policy) use
# build/container/stapeln/compose.toml with `selur-compose` instead.
#
# The Justfile picks the right one automatically:
#   just container-up        # selur-compose if installed, else this file
#
# See https://compose-spec.io for the full specification.

services:
  # ──────────────────────────────────────────────────────────────────────
  # Primary application service
  # ──────────────────────────────────────────────────────────────────────
  "marid":
    build:
      context: ..
      dockerfile: build/container/Containerfile
    image: "ghcr.io/metadatastician/marid:latest"
    ports:
      - "6274:6274"
    environment:
      APP_HOST: "[::]"
      APP_PORT: "6274"
      APP_LOG_FORMAT: "json"
      APP_DATA_DIR: "/data"
    volumes:
      - "marid-data:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6274/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────────
  # rokur — secrets-management gate (stapeln). Fronts the app and refuses
  # to start the stack unless required secrets are present.  on Wolfi.
  # Remove this service if you do not use secret gating.
  # ──────────────────────────────────────────────────────────────────────
  rokur:
    image: ghcr.io/metadatastician/rokur:latest
    environment:
      ROKUR_BACKEND: "http://marid:6274"
      ROKUR_LISTEN: "[::]:6275"
      ROKUR_REQUIRED_SECRETS: ""        # comma-separated env names that MUST be set
      ROKUR_AUDIT_LOG: "/var/log/rokur/audit.jsonl"
      ROKUR_LOG_FORMAT: "json"
    ports:
      - "6275:6275"
    volumes:
      - rokur-audit:/var/log/rokur
    depends_on:
      "marid":
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6275/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────────
  # svalinn — edge gateway (stapeln). TLS termination, auth, rate limiting.
  # Reads the gatekeeper policy from build/container/stapeln/.gatekeeper.yaml.
  # Remove this service for a bare app with no gateway.
  # ──────────────────────────────────────────────────────────────────────
  svalinn:
    image: ghcr.io/metadatastician/svalinn:latest
    ports:
      - "443:443"
      - "80:80"
    environment:
      SVALINN_BACKEND: "http://rokur:6275"
      SVALINN_POLICY_FILE: "/etc/svalinn/gatekeeper.yaml"
      SVALINN_TLS_AUTO: "true"
    volumes:
      - ./stapeln/.gatekeeper.yaml:/etc/svalinn/gatekeeper.yaml:ro
    depends_on:
      - rokur
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────────
  # http-capability-gateway — front-facing capability governance sidecar (BEAM).
  # Enforces declarative HTTP verb exposure (DSL v1), deceptive 404 stealthing,
  # and client trust header verification in front of Marid.
  # ──────────────────────────────────────────────────────────────────────
  gateway:
    image: ghcr.io/hyperpolymath/http-capability-gateway:latest
    ports:
      - "4000:4000"
    environment:
      POLICY_PATH: "/app/config/policy.yaml"
      BACKEND_URL: "http://marid:6274"
      PORT: "4000"
      TRUST_LEVEL_HEADER: "x-trust-level"
    volumes:
      # Generated, never hand-edited:
      #   ./scripts/marid generate capability-spec fixtures/capability/service.jl \
      #     --global-verbs GET --out fixtures/capability/policy.yaml
      # The legacy profile is deliberate for a quickstart: its non-empty global_verbs
      # load on any gateway image, including the mutable :latest tag named above,
      # which cannot be pinned to a digest verified to contain the #112 correction.
      # For deny-by-default swap in fixtures/capability/policy-strict.yaml (empty
      # global_verbs) and run a gateway at or after http-capability-gateway#112
      # (c67c743) - an image built before it rejects the policy and never starts.
      # CI exercises that variant against the pinned commit; see docs/adr/0007 and
      # docs/deployment/docker-compose.adoc.
      - ../../fixtures/capability/policy.yaml:/app/config/policy.yaml:ro
    depends_on:
      "marid":
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  "marid-data":
  rokur-audit:
