name: Julia Packages CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.package }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11']
        os: [ubuntu-latest]
        package:
          - MaridIR
          - MaridCodec
          - MaridOpenAPI
          - MaridRPC
          - MaridGraphQL
          - MaridTransport
          - MaridCore
          - MaridArango
          - MaridStorage
          - MaridControl
          - MaridLive
          - MaridCRDT
          - MaridRaft
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.version }}
      - name: Run Package Tests
        run: |
          julia --startup-file=no scripts/bootstrap.jl packages/${{ matrix.package }}
          julia --startup-file=no --project=packages/${{ matrix.package }} packages/${{ matrix.package }}/test/runtests.jl

  http-json:
    name: Real unary HTTP/JSON (not persistence or browser acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.10.10'
      - run: |
          julia --startup-file=no scripts/bootstrap.jl examples/http_json
          julia --startup-file=no --project=examples/http_json examples/http_json/test/runtests.jl

  cli-and-emitters:
    name: CLI & Emitters - Julia 1.10 - ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.10.10'
      - name: Check Julia [compat] entries (marid#22 / D68)
        run: julia --startup-file=no scripts/check-julia-compat.jl
      - name: Check every package precompiles and loads (marid#40)
        run: julia --startup-file=no scripts/check-packages-precompile.jl
      - name: Verify CLI Capability Spec Generation
        run: |
          ./scripts/marid generate capability-spec fixtures/capability/service.jl \
            --deny-by-default --out /tmp/rel_spec.yaml
          cmp /tmp/rel_spec.yaml fixtures/capability/policy-strict.yaml
          grep -q "^  name: 'CapabilityExample'" /tmp/rel_spec.yaml
          grep -q "dsl_version: '1'" /tmp/rel_spec.yaml
      - name: Run Framework Benchmarks
        run: |
          bash benches/marid_bench.sh json
