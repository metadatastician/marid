# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: CodeQL Security Analysis
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 1 * *'   # monthly 1st 06:00 UTC (Actions burn cut, standards#288)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `actions` scans the workflow YAML only. marid also ships real
          # JavaScript (~36 KB: web/*, examples/, test/interop, scripts/),
          # so scan it too (D63-A, marid#18). CodeQL supports none of Julia,
          # Idris, Zig, Nickel, Just or Shell, so this matrix covers about
          # 5% of the program source; that ceiling is recorded, not hidden.
          #
          # `rust` covers the two scripts/*.rs files through scripts/Cargo.toml
          # (marid#62). Without that manifest the extractor runs syntax-only
          # ("no manifest found: macro expansion will be skipped") and a
          # planted null-pointer deref went undetected. With it, CLI 2.27.1
          # flagged the same plant (rust/access-invalid-pointer) and the clean
          # tree reported 0 results. Deleting scripts/Cargo.toml turns this
          # entry back into a green that checks nothing.
          # Per hypatia rule `codeql_language_matrix_mismatch`.
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
