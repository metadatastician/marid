# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Two things share this file because they are one lane.
#
# `k9-validate` is the existing contract check through the k9-ecosystem
# action. `k9-grid` is the DEED–K9 conformance matrix from
# hyperpolymath/standards (docs/VERDICT-GRID-SPEC.adoc, conformance family):
# the same validator, but rendered as the one-screen verdict grid and posted
# on the pull request by `k9-verdict`. The grid is the reporting lane; the
# contract check remains the blocking one until the grid has been green on
# main at least once (see the removal condition on `continue-on-error`).
name: "🟡 CHECK: K9 Contract Validation"

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  k9-validate:
    name: "🟡 CHECK: Validate K9 contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check for K9 files
        id: detect
        run: |
          COUNT=$(find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' | wc -l)
          CONFIG_COUNT=$(find . \( -name '*.toml' -o -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' -not -path './.deno/*' \
            -not -name 'package-lock.json' -not -name 'Cargo.lock' -not -name 'deno.lock' | wc -l)
          echo "k9_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "config_count=$CONFIG_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ] && [ "$CONFIG_COUNT" -gt 0 ]; then
            echo "::warning::Found $CONFIG_COUNT config files but no K9 contracts. Run k9iser to generate contracts."
          fi

      - name: "🟡 CHECK: Validate K9 contracts"
        if: steps.detect.outputs.k9_count > 0
        uses: hyperpolymath/k9-ecosystem/validate-action@20f6be5b5a14a48680b236955b5c4ad9033d00d4 # main @ 2026-10-01
        with:
          path: '.'
          strict: 'false'

      - name: Write summary
        run: |
          K9_COUNT="${{ steps.detect.outputs.k9_count }}"
          CFG_COUNT="${{ steps.detect.outputs.config_count }}"
          if [ "$K9_COUNT" -eq 0 ]; then
            cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## K9 Contract Validation

          :warning: **No K9 contract files found.** Repos with configuration files should have K9 contracts.

          Generate contracts with: `k9iser generate .`
          EOF
          else
            echo "## K9 Contract Validation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Validated **${K9_COUNT}** K9 contract(s) against **${CFG_COUNT}** config file(s)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The DEED–K9 conformance matrix, one row per category the lane checks.
  #
  # Advisory on purpose, and with an explicit expiry: marid's 18 contracts have
  # never been run through the strict L0–L2 validator this lane uses, so the
  # first grid may legitimately be red on pre-existing debt. A lane that reds
  # every pull request on day one is a lane somebody disables. Removal
  # condition: delete `continue-on-error` once a run on `main` renders green
  # or yellow, and let it gate from then on.
  k9-grid:
    name: "🟡 CHECK: DEED–K9 conformance grid"
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    uses: hyperpolymath/standards/.github/workflows/k9-conformance.yml@01c9b0c9f2646ebea0b30a9588462642ac94aee9
    with:
      require-files: true
      fail-on-indeterminate: false

  k9-verdict:
    name: Post the DEED–K9 verdict grid
    needs: k9-grid
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the verdict grid
        id: grid
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid

      - name: Post the grid, updating the previous one in place
        if: steps.grid.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/k9-grid/report.md
        run: |
          set -euo pipefail
          MARKER='<!-- verdict-grid:k9 regenerated on every run -->'
          if [ ! -s "$REPORT" ]; then
            echo "::warning::the k9-grid artifact carried no report.md; nothing to post"
            exit 0
          fi
          if ! grep -qF "$MARKER" "$REPORT"; then
            { printf '%s\n' "$MARKER"; cat "$REPORT"; } > "$REPORT.tmp"
            mv "$REPORT.tmp" "$REPORT"
          fi

          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
                 | jq -rs --arg m "$MARKER" \
                     '[.[][] | select((.user.login // "") == "github-actions[bot]" and ((.body // "") | contains($m)))] | last | .id // empty')

          payload=$(jq -n --rawfile b "$REPORT" '{body: $b}')
          if [ -n "$id" ]; then
            printf '%s' "$payload" | gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - >/dev/null
            echo "updated verdict grid comment $id"
          else
            printf '%s' "$payload" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - >/dev/null
            echo "created the verdict grid comment"
          fi
