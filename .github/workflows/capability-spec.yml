# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Native Capability Spec
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          version: '1.10.10'
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '27.3.4'
          elixir-version: '1.19.4'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Emitter and CLI tests
        run: |
          julia --startup-file=no --project=packages/MaridIR packages/MaridIR/test/runtests.jl
          bash test/interop/capability_cli.sh
      - uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/http-capability-gateway
          ref: c67c743c6c9f54c0482c1dd8d8dc151ff919551d
          path: gateway-under-test
          persist-credentials: false
      # The correction this job used to patch in is upstream: it merged as
      # hyperpolymath/http-capability-gateway#112. So the job pins that commit and
      # asserts the behaviour is present, instead of applying a patch nobody owns.
      # If the pin is ever moved below the correction, this step fails loudly rather
      # than silently testing a gateway that rejects the policy under test.
      - name: Assert the pinned gateway carries the strict-policy correction
        run: |
          grep -q 'must be a list (empty denies unmatched routes)' \
            gateway-under-test/lib/http_capability_gateway/policy_validator.ex
          test -f gateway-under-test/test/strict_policy_test.exs
          test -f gateway-under-test/test/proxy_wire_test.exs
      - name: Native gateway policy pipeline
        run: |
          mix local.hex --force
          elixir test/interop/capability_gateway.exs gateway-under-test
      - name: Gateway strict-policy and real upstream-wire tests
        working-directory: gateway-under-test
        env:
          VERISIMDB_URL: http://127.0.0.1:1
        run: |
          mix local.rebar --force
          mix deps.get
          mix test test/policy_compiler_test.exs test/policy_validator_test.exs test/strict_policy_test.exs test/proxy_wire_test.exs test/policy_property_test.exs test/policy_capability_test.exs test/gateway_test.exs test/e2e_property_test.exs
      - name: Actual gateway to Julia HTTP roundtrip and backend outage
        run: |
          julia --startup-file=no scripts/bootstrap.jl examples/http_json
          bash test/interop/run_http_gateway.sh gateway-under-test
      # The wider gateway suite has known failures; this targeted integration job
      # does not assert that repository is production-ready or its full CI is green.
      # It also does not patch the gateway: the paired changes are upstream as of
      # #112 (c67c743), which is the pinned commit.
