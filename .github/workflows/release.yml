#
# Release workflow for the Julia packages under packages/ (D69-A, D117).
# Triggered by per-package tags `<Package>-v<version>`, the form TagBot uses for
# subdirectory packages (e.g. MaridCodec-v0.1.0). One tag releases one package.
#
# Ships two files and attests both (D59: tarball digest AND git tree hash):
#   <Pkg>-<ver>.tar.gz  `git archive` of the package subdir tree
#   <Pkg>-<ver>.tree    package, version, subdir, git-tree-sha1, commit -- the
#                       tree hash is what a Julia registry records and verifies
# Verify with `gh attest verify <file> --repo <owner>/<repo>`.
name: Release
on:
  push:
    tags:
      - 'Marid*-v[0-9]*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    name: Release Julia package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # mint the OIDC token attestation provenance is signed with
      attestations: write   # write the build-provenance attestation (the "claim")
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve package and version from the tag
        id: meta
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          pkg="${tag%-v*}"
          ver="${tag##*-v}"
          dir="packages/$pkg"
          if [ ! -f "$dir/Project.toml" ]; then
            echo "::error::tag $tag names no package: $dir/Project.toml does not exist"
            exit 1
          fi
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$dir/Project.toml")"
          if [ "$declared" != "$ver" ]; then
            echo "::error::tag $tag says $ver but $dir/Project.toml declares '$declared'"
            exit 1
          fi
          if [ ! -f "$dir/LICENSE" ]; then
            echo "::error::$dir/LICENSE missing; registries check the package subdir, not the repo root"
            exit 1
          fi
          commit="$(git rev-parse "$tag^{commit}")"
          tree="$(git rev-parse "$commit:$dir")"
          case "$ver" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "pkg=$pkg"
            echo "ver=$ver"
            echo "dir=$dir"
            echo "commit=$commit"
            echo "tree=$tree"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
      - name: Build release files and notes
        env:
          PKG: ${{ steps.meta.outputs.pkg }}
          VER: ${{ steps.meta.outputs.ver }}
          DIR: ${{ steps.meta.outputs.dir }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          TREE: ${{ steps.meta.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git archive --format=tar.gz --prefix="$PKG/" -o "artifacts/$PKG-$VER.tar.gz" "$TREE"
          printf 'package=%s\nversion=%s\nsubdir=%s\ngit-tree-sha1=%s\ncommit=%s\n' \
            "$PKG" "$VER" "$DIR" "$TREE" "$COMMIT" > "artifacts/$PKG-$VER.tree"
          # No earlier <Pkg>-v* tag on a package's first release: describe fails and
          # the notes fall back to the whole history of the subdir.
          prev="$(git describe --tags --abbrev=0 --match "$PKG-v*" "$COMMIT^" 2>/dev/null || true)"
          {
            echo "## $PKG v$VER"
            echo
            echo "Subdirectory \`$DIR\`, git tree \`$TREE\`, commit \`$COMMIT\`."
            echo
            echo "### Changes${prev:+ since $prev}"
            echo
            git log --no-merges --format='- %s (%h)' ${prev:+"$prev.."}"$COMMIT" -- "$DIR"
          } > release-notes.md
          sha256sum artifacts/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ${{ steps.meta.outputs.pkg }} v${{ steps.meta.outputs.ver }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: false
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: 'artifacts/*'
