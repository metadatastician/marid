# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Covers common ecosystems - remove unused ones for your project

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # github/codeql-action is bumped by hand, never by Dependabot (D118).
    # A bump that does not also regenerate .github/workflows/actions.lock
    # is refused at startup (zero jobs), and v4.38.1 is itself an estate
    # startup-killer (nexia-list#100); #55 did both.
    #
    # Dependabot names a sub-action by its PATH: this repo uses
    # `github/codeql-action/init` and `github/codeql-action/analyze`, and a
    # bare `github/codeql-action` matches neither. Measured on #61, which
    # was built from 5e450a7 with the bare-name rules below already in force
    # and still bumped both sub-actions. So every rule lists the bare name
    # AND `github/codeql-action/*`. That is correct whether or not `*`
    # crosses `/`, which the Dependabot options reference does not say.
    #
    # Keep both halves (group exclusion and ignore). A 2026-09-23 estate
    # census saw bare-name ignores "bypassed" by grouped PRs; that evidence
    # fits this name mismatch equally well, so a group bypass is unproven,
    # not refuted. Holding both costs nothing.
    groups:
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
    ignore:
      - dependency-name: "github/codeql-action"
      - dependency-name: "github/codeql-action/*"
    open-pull-requests-limit: 2

  # Rust/Cargo
  #
  # `open-pull-requests-limit: 0` suppresses routine version-update PRs
  # (no weekly patch-bump noise) while leaving Dependabot SECURITY PRs
  # flowing. Under GitHub's current Dependabot behaviour (2024+), using
  # an `ignore:` rule with `version-update:semver-patch` would ALSO
  # silence security PRs that happen to be patch-level — historically
  # the cause of estate-wide vulns sitting un-PR'd for weeks.
  # `open-pull-requests-limit: 0` is the GitHub-endorsed way to say
  # "security only, not routine bumps". Pair with the
  # dependabot-automerge.yml workflow for low-touch security
  # maintenance.
